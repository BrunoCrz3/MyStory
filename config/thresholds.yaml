# Fuente única de números del sistema.
#
# Los documentos (AGENTS.md, docs/) describen las capas, las dimensiones y la política
# de degradación. Las cifras viven aquí y solo aquí: si un número aparece a la vez en un
# documento y en este fichero, el documento está mal.
#
# Un valor `null` no es un olvido. Pero no todos se rellenan igual, y decir «se calibra
# midiendo» de todos ellos es falso: hay cuatro clases, marcadas clave a clave.
#
#   [mutación]   Se calibra separando. Se inyectan defectos conocidos en capítulos ya
#                aceptados y el umbral es el valor que distingue el original del mutante
#                con la precisión y la cobertura que exige `validadores`. Es el único
#                mecanismo que da un número justificado en vez de una apuesta.
#
#   [histórico]  Se calibra observando. No hay mutante posible, así que el umbral es un
#                percentil de la distribución de las propias novelas generadas: dice
#                «esto es raro», no «esto está mal».
#
#   [decisión]   No se mide. Es una preferencia sobre coste, paciencia o tolerancia al
#                falso positivo, y ninguna medición la responde: medir dice dónde está el
#                sistema, no dónde debería estar. No espera histórico; espera que alguien
#                decida.
#
#   [alcance]    Ya está decidido, y no por nosotros: lo fija
#                `docs/requerimientos/alcance-proyecto.md`. No se renegocia aquí.
#
# Mientras un umbral esté en null, el arranque falla en voz alta al pedirlo **para cerrar
# el paso**. Medir y registrar sin suspender no es pedirlo: ver «Fase de medición», abajo.

version: 2

# ---------------------------------------------------------------------------
# Obra
# ---------------------------------------------------------------------------
# La forma del producto. Las tres cifras salen del alcance y ninguna es ajustable
# sin cambiar el encargo.

obra:
  capitulos: 10                      # [alcance] §alcance «10 capítulos»

capitulo:
  longitud_min_palabras: 1000        # [alcance] §alcance «1.000-1.500 palabras»
  longitud_max_palabras: 1500        # [alcance]

# ---------------------------------------------------------------------------
# Presupuesto de contexto
# ---------------------------------------------------------------------------
# Límite duro por petición. Ningún prompt puede superarlo, y el reparto por capa debe
# sumar exactamente este total.
#
# ESTE TOPE ES NUESTRO, NO DEL PROVEEDOR (TO-019). Los modelos de config/models.yaml
# tienen ventanas muy superiores; esta cifra es una decisión de diseño sobre cuánto
# contexto queremos ensamblar, no un techo que nos impongan.
#
# Y no es el límite de tokens concurrentes del alcance §7: ese es `en_vuelo.total`, más
# abajo. Que hoy coincidan en la misma cifra es casualidad aritmética, no una atadura.

contexto:
  total: 100000

  # Las siete capas más el margen. Orden de la tabla, no de degradación.
  capas:
    invariante: 10000      # Premisa, brief de novela, dedicatoria, guía de estilo, voz narrativa
    estructural: 4000      # Brief de capítulo y restricción de destino
    estado: 18000          # Snapshot al cierre del capítulo N-1, nunca texto bruto
    local: 14000           # Últimos capítulos literales
    recuperado: 30000      # Filtrado por entidades del brief de capítulo, luego similitud
    estilo: 8000           # Muestras de voz de los personajes presentes
    anticontexto: 10000    # Repeticiones, clichés vetados y palabras prohibidas de la novela
    margen: 6000           # Reserva para la respuesta y el desbordamiento

  # Orden en que se comprime cuando el ensamblado no cabe. Se para en cuanto quepa.
  # `invariante` y la restricción de destino (dentro de `estructural`) no aparecen
  # aquí a propósito: no se degradan nunca.
  degradacion:
    - recuperado
    - estilo
    - local
    - estado

  # Ventana deslizante del anticontexto, en capítulos. Cuánto se recuerda antes de
  # olvidar. Con diez capítulos el valor tiene poco recorrido, pero la regla se mantiene:
  # un anticontexto que recuerda la novela entera acaba vetando su propio vocabulario.
  anticontexto_ventana_capitulos: null   # [histórico]

# ---------------------------------------------------------------------------
# Presupuesto en vuelo
# ---------------------------------------------------------------------------
# Cuántos tokens pueden estar en peticiones simultáneas. Este SÍ es el límite del
# alcance §7, «uso de un máximo de 100.000 tokens concurrentes».
#
# La estimación de un trabajo es el tamaño de su contexto ensamblado, que ya incluye
# `contexto.capas.margen` como reserva de respuesta. Admisión FIFO estricta: nadie
# adelanta a nadie, así que un trabajo grande no se queda esperando detrás de los
# pequeños. Un trabajo cuya estimación supera `total` falla en voz alta al encolarse; es
# un error de diseño, no una espera.

en_vuelo:
  total: 100000   # [alcance] §7

# ---------------------------------------------------------------------------
# Replanificación
# ---------------------------------------------------------------------------
# No lleva umbral, y su ausencia es la decisión. La replanificación se dispara por
# invalidación de una restricción de destino, que es booleana y determinista: o el canon
# vigente hace imposible una restricción aún no escrita, o no. Una medida acumulativa
# necesitaría un umbral, y un umbral necesita a alguien que etiquete cuándo replanificar;
# ese alguien era el autor humano y la generación es automática.
#
# Ver docs/definitions.md § Modelo de generación, «Por qué la invalidación y no una
# medida de deriva».

replanificacion:
  solo_capitulos_pendientes: true   # [alcance] nunca toca un capítulo ya aceptado

# ---------------------------------------------------------------------------
# Orquestación
# ---------------------------------------------------------------------------
# Dos contadores distintos que se confunden. `max_intentos_capitulo` cuenta reescrituras
# por fallo de validación y es lo que el alcance §3 llama «retries con límite»; al
# agotarse, el capítulo queda `agotado` y la novela `detenida`. `max_intentos_trabajo`
# cuenta reintentos por fallo de infraestructura y no gasta del otro: que el proveedor
# devuelva un 429 no es un defecto del capítulo.

orquestacion:
  max_intentos_capitulo: 3         # [decisión] TO-014 · contador acumulativo; peor caso 4 generaciones
  max_intentos_trabajo: 3          # [decisión] TO-014 · fallo de infraestructura; no gasta del anterior
  backoff:
    base_segundos: null           # [decisión]
    factor: null                  # [decisión]
    jitter: true

# ---------------------------------------------------------------------------
# Guardrail de palabras prohibidas
# ---------------------------------------------------------------------------
# Los tres niveles del alcance §7. El tercero, `perfil`, se deriva de la edad del
# destinatario y del tipo de ocasión: es el único que el comprador no puede enumerar y el
# sistema sí puede calcular solo. Ver docs/definitions.md § Guardrail.
#
# Los tres se aplican en conjunto y gana el más restrictivo. La normalización corre
# ANTES de comparar; desactivar una de sus reglas abre un agujero por variante.

guardrail:
  niveles:
    - global      # insultos y términos ofensivos, iguales para toda novela
    - perfil      # derivado de destinatario.edad y ocasion.tipo
    - novela      # lo define el comprador en la configuración

  normalizacion:
    minusculas: true
    quitar_acentos: true
    quitar_signos: true
    plurales: true
    variantes_simples: true

  # TO-014: NO es un contador aparte, es un SUBLÍMITE dentro de max_intentos_capitulo.
  # Dos pasadas consecutivas sin limpiar el texto detienen la generación sin esperar
  # al tercer intento: un modelo que no quita una palabra en dos pasadas no la quita.
  max_reescrituras: 2      # [decisión] TO-014

# ---------------------------------------------------------------------------
# Fase de medición
# ---------------------------------------------------------------------------
# El arranque en frío es circular: para calibrar hacen falta capítulos aceptados, para
# aceptarlos hace falta la capa de calidad, y para que la capa de calidad cierre el paso
# hacen falta umbrales que todavía no existen.
#
# Con `cerrar_el_paso` en `false` los validadores semánticos puntúan y dejan su score en
# Langfuse, pero no suspenden. Eso produce las dos cosas que la calibración necesita
# —novelas completas y una distribución de puntuaciones— sin estimar ni un número.
#
# Los validadores booleanos NO dependen de esta fase: schema, palabras prohibidas,
# elementos obligatorios y las tres demostraciones de Lean cierran el paso siempre. Un
# capítulo con una palabra vetada no se acepta aunque estemos midiendo.

medicion:
  cerrar_el_paso: false   # [decisión] pasa a true cuando haya con qué calibrar

# ---------------------------------------------------------------------------
# Calidad
# ---------------------------------------------------------------------------
# Una dimensión sin umbral es una opinión, no una métrica.
#
# Aquí solo están las dimensiones que necesitan un NÚMERO. Las que deciden por sí o por
# no —`schema_valido`, `palabras_prohibidas`, `nombres_exactos`, `elementos_obligatorios`,
# `lean_cronologia`, `lean_ubicacion`, `lean_edad`, `render_visual`— no tienen entrada:
# un booleano no se calibra. `longitud` tampoco: su rango está en `capitulo`, arriba.
#
# Las programáticas son [mutación]; las semánticas esperan a que haya distribución.

calidad:
  consistencia_factica: null        # [mutación]
  calidad_prosa: null               # [mutación]
  integridad_pov: null              # [mutación]
  cumplimiento_brief: null          # [mutación]
  personalizacion_natural: null     # [histórico] semántica, con rúbrica
  reconocibilidad: null             # [histórico] semántica, contrastada con revisión humana
  adecuacion_tono: null             # [histórico] semántica
  coherencia_personajes: null       # [histórico] semántica
  ritmo: null                       # [histórico] semántica
  cierre_arco: null                 # [histórico] parte semántica; la programática es exacta

# ---------------------------------------------------------------------------
# Continuidad y estructura
# ---------------------------------------------------------------------------
# No puntúan una dimensión de calidad: cuentan capítulos, comparan firmas o miden
# distancia a una línea base.

continuidad:
  promesas_pendientes_al_cerrar: 0      # [alcance] «sin final abrupto»: cero, no un umbral
  capitulos_sin_avanzar_arco: null      # [histórico]
  capitulos_sin_avanzar_hilo: null      # [histórico]
  similitud_capitulo_duplicado: null    # [mutación]
  repeticion_descripcion_entidad: null  # [mutación] medida al consolidar
  deriva_estilo_vs_linea_base: null     # [mutación]

# ---------------------------------------------------------------------------
# Medida de los validadores
# ---------------------------------------------------------------------------
# Mínimos que ha de alcanzar cada validador sobre el corpus de defectos inyectados. Es
# el umbral que hace que los demás umbrales signifiquen algo: un validador por debajo de
# esto no aprueba ni suspende, adivina.

validadores:
  precision_minima: null                # [decisión]
  cobertura_minima: null                # [decisión]

# ---------------------------------------------------------------------------
# Salida del modelo por rol
# ---------------------------------------------------------------------------
# El `max_tokens` de cada llamada, por rol. Vive aquí y no en config/models.yaml porque
# es una cifra del presupuesto, no un identificador (TO-013).
#
# INVARIANTE QUE SE COMPRUEBA AL ARRANCAR: `contexto.capas.margen` >= el max_tokens de
# CADA rol. Con thinking adaptativo los tokens de razonamiento cuentan dentro de
# max_tokens, así que el margen solo cubre la respuesta si esa desigualdad se cumple. Si
# no se cumple, el arranque falla en voz alta: un margen corto no da un error claro, da
# respuestas truncadas a mitad de capítulo que parecen un problema de calidad.

modelo:
  max_tokens_por_rol:
    entrevistador: null   # [decisión] pendiente de fijar junto con el margen
    planificador: null    # [decisión]
    redactor: null        # [decisión] el mayor de los seis: escribe el capítulo entero
    editor: null          # [decisión]
    judge: null           # [decisión] solo puntuaciones y justificaciones
    extractor: null       # [decisión]

# ---------------------------------------------------------------------------
# Verificación formal
# ---------------------------------------------------------------------------
# TO-016. El gate es lo único que bloquea; el chequeo incremental por capítulo es un
# aviso temprano y no detiene nada.
#
# El timeout está en null a propósito y no por olvido: NO HAY TOOLCHAIN LEAN en la
# máquina de desarrollo, así que el coste está estimado y no medido. Se fija midiendo,
# no decidiendo. Restricción de diseño que lo condiciona: el fichero .lean generado no
# importa Mathlib, que es lo que mantiene el build en segundos.

formal:
  lean_incremental: true         # [decisión] TO-016 · aviso por capítulo, no bloqueante
  lean_timeout_segundos: null    # [bloqueado] TO-016 · falta medirlo con la toolchain instalada

# ---------------------------------------------------------------------------
# Export a PDF
# ---------------------------------------------------------------------------
# TO-025. El PDF se genera bajo demanda, una vez por versión, y en ese momento corre
# `paridad_pdf_web`. Recuento de capítulos, títulos, índice y dedicatoria son booleanos;
# lo único que necesita margen es el recuento de palabras, que difiere entre el render
# web y el paginado del PDF por guionado y saltos.

export:
  tolerancia_recuento_palabras: null   # [decisión] TO-025 · desviación admitida por capítulo

# ---------------------------------------------------------------------------
# Comprobación del modelo del harness
# ---------------------------------------------------------------------------
# Tamaño del modelo pequeño sobre el que corre el comprobador. Sale del alcance §5d,
# «por ejemplo, 5 capítulos y 2 reintentos». No es el tamaño de la novela real: es el
# espacio de estados que se explora de forma exhaustiva, y subirlo lo hace explotar.
# Corre en desarrollo, no en cada generación.

modelo_formal:
  capitulos: 5      # [alcance] §5d
  reintentos: 2     # [alcance] §5d

# ---------------------------------------------------------------------------
# Recuperación y embeddings
# ---------------------------------------------------------------------------
# Modelo multilingüe local. Que un cambio de modelo o de versión obligue a reindexar no
# es configurable: es una regla, no un ajuste.

embeddings:
  modelo: bge-m3          # alternativa aprobada: multilingual-e5-large
  version: null           # versión concreta del modelo; se fija al elegir el artefacto
  dimension: null         # debe coincidir con la declarada en la tabla vec0

recuperacion:
  max_fragmentos: null    # [decisión] tope antes de ordenar por similitud
