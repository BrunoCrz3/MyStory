# Fuente única de números del sistema.
#
# Los documentos (AGENTS.md, docs/) describen las capas, las dimensiones y la política
# de degradación. Las cifras viven aquí y solo aquí: si un número aparece a la vez en un
# documento y en este fichero, el documento está mal.
#
# Un valor `null` no es un olvido. Pero no todos se rellenan igual, y decir «se calibra
# midiendo» de todos ellos es falso: hay tres clases, marcadas clave a clave.
#
#   [mutación]   Se calibra separando. Se inyectan defectos conocidos en escenas ya
#                aceptadas y el umbral es el valor que distingue el original del mutante
#                con la precisión y la cobertura que exige `validadores`. Es el único
#                mecanismo que da un número justificado en vez de una apuesta.
#                Ver docs/verification.md § Soluciones pícaras #12 y la fila P-50.
#
#   [histórico]  Se calibra observando. No hay mutante posible, así que el umbral es un
#                percentil de la distribución de la propia obra: dice «esto es raro en
#                esta obra», no «esto está mal». Por eso RF-PROC-08 registra la medida de
#                deriva desde v1 aunque `replanning/` quede fuera.
#
#   [decisión]   No se mide. Es una preferencia del autor sobre coste, paciencia o
#                tolerancia al falso positivo, y ninguna medición la responde: medir dice
#                dónde está el sistema, no dónde debería estar. No espera histórico;
#                espera que alguien decida.
#
#   [bloqueado]  No se puede calibrar todavía porque falta definir qué se mide.
#
# Mientras un umbral esté en null, el arranque falla en voz alta al pedirlo **para cerrar
# el paso** (RF-QUA-05). Medir y registrar sin suspender no es pedirlo: ver «Fase de
# medición», abajo.

version: 1

# ---------------------------------------------------------------------------
# Presupuesto de contexto
# ---------------------------------------------------------------------------
# Límite duro de la ventana. Ningún prompt puede superarlo (AGENTS.md, decisión cerrada).
# El reparto por capa debe sumar exactamente este total: es la constante única de
# RF-CTX-02, y la comprobación de la suma se hace contra este fichero.

contexto:
  total: 100000

  # Las siete capas más el margen. Orden de la tabla, no de degradación.
  capas:
    invariante: 6000       # Premisa, guía de estilo, glosario canónico
    estructural: 4000      # Brief de escena y restricción de destino
    estado: 18000          # Snapshot derivado en t, nunca texto bruto
    local: 30000           # Últimas escenas literales
    recuperado: 25000      # sqlite-vec, filtrado por entidades del brief
    estilo: 8000           # Muestras de voz de los personajes presentes
    anticontexto: 5000     # Repeticiones, clichés vetados, revelaciones prohibidas
    margen: 4000           # Reserva para la respuesta y el desbordamiento

  # Orden en que se comprime cuando el ensamblado no cabe. Se para en cuanto quepa.
  # `invariante` y la restricción de destino (dentro de `estructural`) no aparecen
  # aquí a propósito: no se degradan nunca.
  degradacion:
    - recuperado
    - estilo
    - local
    - estado

  # Ventana deslizante del anticontexto, en escenas. Cuánto se recuerda antes de olvidar.
  anticontexto_ventana_escenas: null   # [histórico]

# ---------------------------------------------------------------------------
# Presupuesto en vuelo
# ---------------------------------------------------------------------------
# Cuantos tokens pueden estar en peticiones simultaneas. No es la ventana: la ventana la
# fija el proveedor y limita UNA peticion; esto lo fija el autor y limita cuantas caben a
# la vez. Que hoy coincidan en 100000 es deliberado, no los ata: el dia que el proveedor
# ofrezca mas ventana, la concurrencia no debe subir sola.
#
# La estimacion de un trabajo es el tamano de su contexto ensamblado, que ya incluye
# `contexto.capas.margen` como reserva de respuesta. Admision FIFO estricta: nadie
# adelanta a nadie, asi que un trabajo grande no se queda esperando detras de los
# pequenos. Un trabajo cuya estimacion supera `total` falla en voz alta al encolarse; es
# un error de diseno, no una espera (architecture.md, seccion Presupuesto en vuelo).

en_vuelo:
  total: 100000   # [decisión] tope de tokens en peticiones simultaneas

# ---------------------------------------------------------------------------
# Deriva
# ---------------------------------------------------------------------------
# El alcance de v1 lo fija docs/specs/001-backend-v1/spec.md §1.3, no este fichero.
# Que la medida se registre por escena no es configurable: es RF-PROC-08.
#
# `medida` ya no es una clave. La medida está definida en definitions.md, seccion Medida
# de la deriva: un vector de tres componentes, sin agregado escalar. Aquí solo viven sus
# umbrales, uno por componente, porque comparar un vector contra un solo numero seria
# perder justo la informacion por la que es un vector.
#
# Se calibran en modo sombra: v1 registra el vector por escena aceptada y tambien cuando
# el autor replanifica o edita briefs a mano. Esas decisiones son las etiquetas, y el
# umbral de un componente es el valor que mejor separa "replanifico en las siguientes k
# escenas" de "no lo hizo". Mientras sigan en null no disparan nada y no impiden arrancar.

deriva:
  umbral:
    invalidacion: null                # [histórico] con etiquetas del autor
    canon_huerfano: null              # [histórico] con etiquetas del autor
    inviabilidad_pago: null           # [histórico] con etiquetas del autor

  # Contrapeso. Un esquema que declara pocas restricciones de destino tiene deriva baja
  # por no decir nada, y uno que no declara ninguna la tiene en cero para siempre: la
  # medida, a solas, premia no planificar. Por debajo de esta densidad la medicion se
  # reporta NO FIABLE, que no es lo mismo que reportarla baja.
  densidad_declaracion_minima: null   # [decisión] restricciones por escena planificada

# ---------------------------------------------------------------------------
# Orquestación
# ---------------------------------------------------------------------------

orquestacion:
  max_iteraciones_revision: null   # [decisión] al alcanzarlo, escala al autor
  max_intentos_trabajo: null       # [decisión] reintentos ante fallo de infraestructura
  backoff:
    base_segundos: null           # [decisión]
    factor: null                  # [decisión]
    jitter: true

# ---------------------------------------------------------------------------
# Fase de medición
# ---------------------------------------------------------------------------
# El arranque en frío es circular: para calibrar hacen falta escenas aceptadas, para
# aceptarlas por el ciclo hace falta la capa de calidad, y para que la capa de calidad
# cierre el paso hacen falta umbrales que todavía no existen.
#
# Se rompe por donde la ontología ya lo permite: quien acepta una escena es el autor, no
# el umbral (RF-PROC-07, fila P-19). Con `cerrar_el_paso` en `false` el crítico puntúa y
# deja su puntuación en el `Informe de crítica`, pero no suspende. Eso produce las dos
# cosas que la calibración necesita —escenas aceptadas y una distribución de
# puntuaciones— sin estimar ni un número.
#
# Es una fase declarada, no una excepción silenciosa. Ponerlo en `true` con umbrales en
# null hace fallar el arranque, que es exactamente lo que verifica A-41.

medicion:
  cerrar_el_paso: false   # [decisión] pasa a true cuando haya con qué calibrar

# ---------------------------------------------------------------------------
# Calidad
# ---------------------------------------------------------------------------
# Una dimensión sin umbral es una opinión, no una métrica (definitions.md, Capa 4).
# Solo se listan las dimensiones clasificadas `T` en docs/verification.md: son las que
# v1 puntúa. Las `D` y `U` quedan fuera de v1 y por eso no tienen entrada aquí.
# Todas son [mutación]: se calibran con la pícara #12 sobre escenas ya aceptadas.

calidad:
  consistencia_factica: null
  consistencia_temporal: null
  consistencia_espacial: null
  consistencia_epistemica: null
  plausibilidad_especulativa: null
  distintividad_de_voz: null
  calidad_de_prosa: null
  mostrar_vs_contar: null
  integridad_de_pov: null
  causalidad: null
  ritmo: null
  carga_expositiva: null
  originalidad: null
  cumplimiento_del_brief: null

# ---------------------------------------------------------------------------
# Modelo de generación
# ---------------------------------------------------------------------------
# El proveedor es la API de Claude (architecture.md § Adaptación del modelo). El
# timeout vive aquí y no en el código porque RI-06 exige que sea explícito y A-40 prohíbe
# escribir cifras sueltas: un timeout implícito es un cuelgue esperando a ocurrir.
#
# No hay `max_tokens` propio. El tope de la respuesta es `contexto.capas.margen`, que ya
# es la reserva declarada para ella; repetirlo aquí sería la cifra duplicada que A-40 veta.

modelo:
  id: claude-opus-5
  timeout_segundos: 600   # [decisión] cota superior de una llamada, reintentos aparte

# ---------------------------------------------------------------------------
# Recuperación y embeddings
# ---------------------------------------------------------------------------
# Modelo multilingüe local. El porqué está en architecture.md § Embeddings y reindexado;
# aquí solo el valor con el que arranca el sistema. Que un cambio de modelo o de versión
# obligue a reindexar no es configurable: es una regla, no un ajuste.

embeddings:
  modelo: bge-m3          # alternativa aprobada: multilingual-e5-large
  version: null           # versión concreta del modelo; se fija al elegir el artefacto
  dimension: null         # debe coincidir con la declarada en la tabla vec0

recuperacion:
  max_fragmentos: null    # [decisión] tope antes de ordenar por similitud

# ---------------------------------------------------------------------------
# Continuidad y estructura
# ---------------------------------------------------------------------------
# No puntuan una dimension de calidad: cuentan escenas, comparan firmas o miden
# distancia a una linea base. Salen del catalogo de modos de fallo; cada clave
# dice que fila de docs/verification.md la lee.

continuidad:
  escenas_sin_avanzar_arco: null        # [histórico] P-44
  escenas_sin_avanzar_hilo: null        # [histórico] P-44
  promesas_pendientes_max: null         # [histórico] P-44
  similitud_escena_duplicada: null      # [mutación] P-43, firma dramatica + vecino vec0
  repeticion_descripcion_entidad: null  # [mutación] P-09, medida al consolidar
  deriva_estilo_vs_linea_base: null     # [mutación] P-49
  densidad_acto_final: null             # [histórico] P-14

# ---------------------------------------------------------------------------
# Higiene de salida
# ---------------------------------------------------------------------------
# La puerta de A-47 es booleana salvo en la longitud, que necesita margen.

higiene:
  desviacion_longitud_escena: null      # [decisión] A-47, sale de Obra.extension objetivo

# ---------------------------------------------------------------------------
# Medida de los validadores
# ---------------------------------------------------------------------------
# Minimos que ha de alcanzar cada validador sobre el corpus de defectos
# inyectados. Es el umbral que hace que los demas umbrales signifiquen algo:
# un validador por debajo de esto no aprueba ni suspende, adivina.

validadores:
  precision_minima: null                # [decisión] P-50
  cobertura_minima: null                # [decisión] P-50
