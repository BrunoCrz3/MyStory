# Fuente única de números del sistema.
#
# Los documentos (CLAUDE.md, docs/) describen las capas, las dimensiones y la política
# de degradación. Las cifras viven aquí y solo aquí: si un número aparece a la vez en un
# documento y en este fichero, el documento está mal.
#
# Un valor `null` no es un olvido. Pero no todos se rellenan igual, y decir «se calibra
# midiendo» de todos ellos es falso: hay cuatro clases, marcadas clave a clave.
#
#   [mutación]   Se calibra separando. Se inyectan defectos conocidos en capítulos ya
#                aceptados y el umbral es el valor que distingue el original del mutante
#                con la precisión y la cobertura que exige `validadores`. Es el único
#                mecanismo que da un número justificado en vez de una apuesta.
#
#   [histórico]  Se calibra observando. No hay mutante posible, así que el umbral es un
#                percentil de la distribución de las propias novelas generadas: dice
#                «esto es raro», no «esto está mal».
#
#   [decisión]   No se mide. Es una preferencia sobre coste, paciencia o tolerancia al
#                falso positivo, y ninguna medición la responde: medir dice dónde está el
#                sistema, no dónde debería estar. No espera histórico; espera que alguien
#                decida.
#
#   [alcance]    Ya está decidido, y no por nosotros: lo fija
#                `docs/requerimientos/alcance-proyecto.md`. No se renegocia aquí.
#
# Mientras un umbral esté en null, el arranque falla en voz alta al pedirlo **para cerrar
# el paso**. Medir y registrar sin suspender no es pedirlo: ver «Fase de medición», abajo.

version: 2

# ---------------------------------------------------------------------------
# Obra
# ---------------------------------------------------------------------------
# La forma del producto. Las tres cifras salen del alcance y ninguna es ajustable
# sin cambiar el encargo.

obra:
  capitulos: 10                      # [alcance] §alcance «10 capítulos»

capitulo:
  longitud_min_palabras: 1000        # [alcance] §alcance «1.000-1.500 palabras»
  longitud_max_palabras: 1500        # [alcance]

# ---------------------------------------------------------------------------
# Presupuesto de contexto
# ---------------------------------------------------------------------------
# Límite duro por petición. Ningún prompt puede superarlo, y el reparto por capa debe
# sumar exactamente este total.
#
# ESTE TOPE ES NUESTRO, NO DEL PROVEEDOR (TO-019). Los modelos de config/models.yaml
# tienen ventanas muy superiores; esta cifra es una decisión de diseño sobre cuánto
# contexto queremos ensamblar, no un techo que nos impongan.
#
# Y no es el límite de tokens concurrentes del alcance §7: ese es `en_vuelo.total`, más
# abajo. Que hoy coincidan en la misma cifra es casualidad aritmética, no una atadura.

contexto:
  total: 100000

  # Las siete capas más el margen. Orden de la tabla, no de degradación.
  capas:
    invariante: 10000      # Premisa, brief de novela, dedicatoria, guía de estilo, voz narrativa
    estructural: 4000      # Brief de capítulo y restricción de destino
    estado: 18000          # Snapshot al cierre del capítulo N-1, nunca texto bruto
    local: 14000           # Últimos capítulos literales
    recuperado: 30000      # Filtrado por entidades del brief de capítulo, luego similitud
    estilo: 8000           # Muestras de voz de los personajes presentes
    anticontexto: 10000    # Repeticiones, clichés vetados y palabras prohibidas de la novela
    margen: 6000           # Reserva para la respuesta y el desbordamiento

  # Orden en que se comprime cuando el ensamblado no cabe. Se para en cuanto quepa.
  # `invariante` y la restricción de destino (dentro de `estructural`) no aparecen
  # aquí a propósito: no se degradan nunca.
  degradacion:
    - recuperado
    - estilo
    - local
    - estado

  # Ventana deslizante del anticontexto, en capítulos. Cuánto se recuerda antes de
  # olvidar. Con diez capítulos el valor tiene poco recorrido, pero la regla se mantiene:
  # un anticontexto que recuerda la novela entera acaba vetando su propio vocabulario.
  anticontexto_ventana_capitulos: 3      # [provisional — calibrar tras la demo] con diez capítulos,
                                         # recordar los tres últimos evita que la novela acabe
                                         # vetando su propio vocabulario

# ---------------------------------------------------------------------------
# Presupuesto en vuelo
# ---------------------------------------------------------------------------
# Cuántos tokens pueden estar en peticiones simultáneas. Este SÍ es el límite del
# alcance §7, «uso de un máximo de 100.000 tokens concurrentes».
#
# La estimación de un trabajo es el tamaño de su contexto ensamblado, que ya incluye
# `contexto.capas.margen` como reserva de respuesta. Admisión FIFO estricta: nadie
# adelanta a nadie, así que un trabajo grande no se queda esperando detrás de los
# pequeños. Un trabajo cuya estimación supera `total` falla en voz alta al encolarse; es
# un error de diseño, no una espera.

en_vuelo:
  total: 100000   # [alcance] §7

# ---------------------------------------------------------------------------
# Replanificación
# ---------------------------------------------------------------------------
# No lleva umbral, y su ausencia es la decisión. La replanificación se dispara por
# invalidación de una restricción de destino, que es booleana y determinista: o el canon
# vigente hace imposible una restricción aún no escrita, o no. Una medida acumulativa
# necesitaría un umbral, y un umbral necesita a alguien que etiquete cuándo replanificar;
# ese alguien era el autor humano y la generación es automática.
#
# Ver docs/definitions.md § Modelo de generación, «Por qué la invalidación y no una
# medida de deriva».

replanificacion:
  solo_capitulos_pendientes: true   # [alcance] nunca toca un capítulo ya aceptado

# ---------------------------------------------------------------------------
# Orquestación
# ---------------------------------------------------------------------------
# Dos contadores distintos que se confunden. `max_intentos_capitulo` cuenta reescrituras
# por fallo de validación y es lo que el alcance §3 llama «retries con límite»; al
# agotarse, el capítulo queda `agotado` y la novela `detenida`. `max_intentos_trabajo`
# cuenta reintentos por fallo de infraestructura y no gasta del otro: que el proveedor
# devuelva un 429 no es un defecto del capítulo.

orquestacion:
  max_intentos_capitulo: 3         # [decisión] TO-014 · contador acumulativo; peor caso 4 generaciones
  max_intentos_trabajo: 3          # [decisión] TO-014 · fallo de infraestructura; no gasta del anterior
  backoff:
    base_segundos: 2              # [provisional — calibrar tras la demo] 2s, 4s, 8s con jitter;
    factor: 2                     # con max_intentos_trabajo=3 el peor caso son ~14s de espera
    jitter: true

  # [provisional — calibrar tras la demo] Timeout de una llamada al modelo, en segundos
  # (RNF-05). Cinco minutos cubren un capítulo con razonamiento a effort alto sin streaming;
  # una llamada que tarda más es un cuelgue, y cuenta como fallo de infraestructura.
  timeout_llamada_segundos: 300

# ---------------------------------------------------------------------------
# Guardrail de palabras prohibidas
# ---------------------------------------------------------------------------
# Los tres niveles del alcance §7. El tercero, `perfil`, se deriva de la edad del
# destinatario y del tipo de ocasión: es el único que el comprador no puede enumerar y el
# sistema sí puede calcular solo. Ver docs/definitions.md § Guardrail.
#
# Los tres se aplican en conjunto y gana el más restrictivo. La normalización corre
# ANTES de comparar; desactivar una de sus reglas abre un agujero por variante.

guardrail:
  niveles:
    - global      # insultos y términos ofensivos, iguales para toda novela
    - perfil      # derivado de destinatario.edad y ocasion.tipo
    - novela      # lo define el comprador en la configuración

  normalizacion:
    minusculas: true
    quitar_acentos: true
    quitar_signos: true
    plurales: true
    variantes_simples: true

  # TO-014: NO es un contador aparte, es un SUBLÍMITE dentro de max_intentos_capitulo.
  # Dos pasadas consecutivas sin limpiar el texto detienen la generación sin esperar
  # al tercer intento: un modelo que no quita una palabra en dos pasadas no la quita.
  max_reescrituras: 2      # [decisión] TO-014

# ---------------------------------------------------------------------------
# Fase de medición
# ---------------------------------------------------------------------------
# El arranque en frío es circular: para calibrar hacen falta capítulos aceptados, para
# aceptarlos hace falta la capa de calidad, y para que la capa de calidad cierre el paso
# hacen falta umbrales que todavía no existen.
#
# Con `cerrar_el_paso` en `false` los validadores semánticos puntúan y dejan su score en
# Langfuse, pero no suspenden. Eso produce las dos cosas que la calibración necesita
# —novelas completas y una distribución de puntuaciones— sin estimar ni un número.
#
# Los validadores booleanos NO dependen de esta fase: schema, palabras prohibidas,
# elementos obligatorios y las tres demostraciones de Lean cierran el paso siempre. Un
# capítulo con una palabra vetada no se acepta aunque estemos midiendo.

medicion:
  cerrar_el_paso: false   # [decisión] pasa a true cuando haya con qué calibrar

# ---------------------------------------------------------------------------
# Calidad
# ---------------------------------------------------------------------------
# Una dimensión sin umbral es una opinión, no una métrica.
#
# Aquí solo están las dimensiones que necesitan un NÚMERO. Las que deciden por sí o por
# no —`schema_valido`, `palabras_prohibidas`, `nombres_exactos`, `elementos_obligatorios`,
# `reglas_mundo`, `estructura_edicion`, `regeneracion_fiel`, `lean_cronologia`,
# `lean_ubicacion`, `lean_edad`, `render_visual`— no tienen entrada: un booleano no se
# calibra. `longitud` tampoco: su rango está en `capitulo`, arriba.
#
# TODOS LOS VALORES DE ESTA SECCIÓN SON [provisional — calibrar tras la demo]. Ninguno
# sale de una medición: salen de decidir con qué error prefiere fallar el sistema mientras
# no haya corpus. El criterio va clave a clave, porque un número sin criterio no se puede
# revisar después: solo se puede volver a inventar.
#
# La escala es 0.00–1.00 para todo score semántico y para los programáticos que puntúan
# en vez de contar. Se fija aquí porque la rúbrica no la declaraba y sin ella los umbrales
# no significan nada.

calidad:
  # [provisional — calibrar tras la demo] Casi booleana: una contradicción con el canon es
  # un defecto, no una cuestión de grado. Alto a propósito, y el falso positivo es barato
  # porque la corrección la hace el editor sin intervención.
  consistencia_factica: 0.90

  # [provisional — calibrar tras la demo] Tolerante: es un agregado de ecos, muletillas y
  # clichés, y en la demo interesa más que la novela salga que apurar la prosa. Las
  # métricas finas viven en `prosa`, abajo.
  calidad_prosa: 0.70

  # [provisional — calibrar tras la demo] Alta pero no máxima: la persona y el tiempo
  # verbal se detectan sobre la narración y el diálogo los mezcla legítimamente, así que
  # un 1.00 suspendería capítulos correctos con mucho diálogo.
  integridad_pov: 0.85

  # [provisional — calibrar tras la demo] Los tres tipos de restricción de destino se
  # cotejan contra el snapshot; se deja margen para el capítulo que cumple su destino por
  # una vía que el cotejo no reconoce.
  cumplimiento_brief: 0.80

  # [provisional — calibrar tras la demo] Semántica, sin distribución todavía. Se sitúa
  # justo por encima del punto medio: por debajo de 0.70 la personalización se nota
  # pegada, y exigir más sin corpus produciría reescrituras en cadena.
  personalizacion_natural: 0.70

  # [provisional — calibrar tras la demo] Mismo criterio, y además es la dimensión que el
  # revisor humano contrasta: conviene que el judge no sea más exigente que la persona
  # mientras no se haya medido el acuerdo.
  reconocibilidad: 0.70

  # [provisional — calibrar tras la demo] Algo más alto que las dos anteriores porque el
  # tono inadecuado para la edad o la ocasión es el fallo que más se nota en un regalo, y
  # el nivel `perfil` del guardrail solo cubre su parte léxica.
  adecuacion_tono: 0.75

  # [provisional — calibrar tras la demo] El comprador lo nombra explícitamente como
  # inconsistencia inaceptable; por encima de la media, por debajo de lo casi booleano,
  # porque la coherencia de un personaje admite grados y el juicio es de modelo.
  coherencia_personajes: 0.75

  # [provisional — calibrar tras la demo] El más bajo de los semánticos: el judge puntúa
  # el ritmo capítulo a capítulo y el ritmo es una propiedad de la obra entera, así que su
  # lectura es la menos fiable de las seis. Suspender por ella sería suspender por ruido.
  ritmo: 0.65

  # [provisional — calibrar tras la demo] Solo la mitad semántica. La programática es
  # exacta y vive en `continuidad.promesas_pendientes_al_cerrar`, que es cero.
  cierre_arco: 0.80

  # [provisional — calibrar tras la demo] PO-1. Cuenta hechos, no puntúa: CERO hechos
  # personales sobre el destinatario que no vengan del brief o del texto libre. Es el
  # fallo más grave del sistema en un regalo y no admite umbral blando.
  invencion_destinatario: 0

  # [provisional — calibrar tras la demo] PO-2. Cuenta apariciones: cero. Un tema que el
  # comprador vetó no aparece «poco».
  temas_excluidos: 0

  # [provisional — calibrar tras la demo] PO-7. NO es 0–1: es el índice INFLESZ para
  # español, donde más alto es más fácil de leer. 60 es «normal», el registro de una
  # novela adulta. El validador SUBE la exigencia a 80 —«bastante fácil»— cuando
  # `destinatario.edad` es menor de 12, que es el único caso en que la legibilidad decide
  # si el regalo se puede leer.
  legibilidad_inflesz_minimo: 60
  legibilidad_inflesz_minimo_infantil: 80

# ---------------------------------------------------------------------------
# Continuidad y estructura
# ---------------------------------------------------------------------------
# No puntúan una dimensión de calidad: cuentan capítulos, comparan firmas o miden
# distancia a una línea base.

continuidad:
  promesas_pendientes_al_cerrar: 0      # [alcance] «sin final abrupto»: cero, no un umbral

  # [provisional — calibrar tras la demo] Con diez capítulos, un arco que pasa tres sin
  # avanzar se ha comido el 30 % de la novela. Dos deja margen a un capítulo de respiro.
  capitulos_sin_avanzar_arco: 2

  # [provisional — calibrar tras la demo] Uno más que el arco: un hilo secundario puede
  # esperar más que la trayectoria del protagonista sin que el lector lo note.
  capitulos_sin_avanzar_hilo: 3

  # [provisional — calibrar tras la demo] Similitud coseno entre capítulos. Por encima de
  # 0.85 dos capítulos de la misma novela, con los mismos personajes y el mismo tono,
  # están contando lo mismo. Por debajo, el parecido es de familia y no de copia.
  similitud_capitulo_duplicado: 0.85

  # [provisional — calibrar tras la demo] Se mide al consolidar, comparando la descripción
  # nueva de una entidad con las ya registradas. Más estricto que el duplicado de capítulo
  # porque re-describir a un personaje con las mismas palabras cansa antes.
  repeticion_descripcion_entidad: 0.80

  # [provisional — calibrar tras la demo] Distancia máxima al estilo de los capítulos ya
  # aceptados. 0.25 tolera que la novela evolucione y caza el capítulo que parece de otro
  # libro. Ojo con el sesgo declarado: si la novela empezó floja, premia seguir floja.
  deriva_estilo_vs_linea_base: 0.25

  # [provisional — calibrar tras la demo] PO/O-17. Fracción mínima de capítulos que
  # contienen al menos un elemento personalizado. 0.60 son seis de diez: por debajo, la
  # personalización está concentrada y el resto de la novela podría ser de cualquiera.
  dispersion_elementos_personalizados: 0.60

  # [provisional — calibrar tras la demo] Coeficiente de variación máximo de la longitud
  # entre capítulos. Con el rango de 1.000–1.500 palabras, 0.20 es holgado: sirve para
  # cazar el capítulo que se quedó a medias, no para uniformar la novela.
  varianza_longitud_entre_capitulos: 0.20

# ---------------------------------------------------------------------------
# Prosa
# ---------------------------------------------------------------------------
# Los linters de prosa que alimentan `calidad.calidad_prosa`. Todos son
# [provisional — calibrar tras la demo]: ninguno sale de medir el corpus, porque no hay
# corpus. Las densidades van por cada 1.000 palabras, que es entre dos tercios y un
# capítulo entero.

prosa:
  # Repeticiones admitidas de un mismo 5-grama entre capítulos distintos. Dos tolera la
  # coletilla de un personaje; tres ya es el modelo repitiéndose.
  repeticion_ngramas: 2

  # Muletillas por cada 1.000 palabras, contra lista cerrada. Tres deja pasar el tic de
  # voz y caza el relleno.
  densidad_muletillas: 3.0

  # Clichés y giros típicos de texto generado por cada 1.000 palabras. Más estricto que
  # las muletillas: un cliché no es voz de nadie.
  densidad_cliches: 2.0

  # Adverbios en -mente por cada 1.000 palabras. Ocho es generoso para el español, donde
  # son más naturales que en inglés; el objetivo es el abuso, no el uso.
  densidad_adverbios: 8.0

  # Coeficiente de variación MÍNIMO de la longitud de frase. Es el único umbral que se
  # exige por abajo: la prosa mecánica se reconoce porque todas las frases miden igual.
  varianza_longitud_frase: 0.40

# ---------------------------------------------------------------------------
# Medida de los validadores
# ---------------------------------------------------------------------------
# Mínimos que ha de alcanzar cada validador sobre el corpus de `Defecto inyectado`. Es el
# umbral que hace que los demás umbrales signifiquen algo: un validador por debajo de esto
# no aprueba ni suspende, adivina.

validadores:
  # [provisional — calibrar tras la demo] Un falso positivo cuesta una reescritura; un
  # falso negativo se va en la novela. Por eso la precisión se exige más alta que la
  # cobertura: es preferible reescribir de más a publicar un defecto.
  precision_minima: 0.80
  cobertura_minima: 0.70

  # [provisional — calibrar tras la demo] Cobertura de la suite de pruebas. 0.70 es lo que
  # se puede sostener en dos días sin escribir pruebas de adorno para subir el número.
  cobertura_tests_minima: 0.70

  # [provisional — calibrar tras la demo] Correlación de Spearman entre el judge y el
  # revisor humano, criterio a criterio, sobre las diez parejas que da una novela. 0.60 es
  # acuerdo moderado: por debajo, el judge y la persona no están midiendo lo mismo. Con
  # n=10 y una sola novela es un indicio, no una medida.
  acuerdo_minimo_judge_humano: 0.60

  # [provisional — calibrar tras la demo] Desviación máxima del judge ante la misma
  # entrada, en la escala 0–1. Por encima de 0.10 la puntuación depende más del muestreo
  # que del capítulo, y ningún umbral de `calidad` significa nada.
  tolerancia_estabilidad_judge: 0.10

# ---------------------------------------------------------------------------
# Coste y latencia
# ---------------------------------------------------------------------------
# Topes por novela completa. No cierran el paso de un capítulo: detienen la generación y
# lo informan, como cualquier otro límite de `CLAUDE.md` regla 14.

coste:
  # [provisional — calibrar tras la demo] Treinta minutos para diez capítulos en serie más
  # el gate. Sale de la demo, no de una medición: por encima de eso no se puede enseñar en
  # directo. Se revisa con la primera novela real cronometrada.
  latencia_maxima_novela: 1800

  # [provisional — calibrar tras la demo] Dólares por novela. Diez capítulos con el
  # redactor en el modelo alto, más judge y editor, más reintentos. Es un tope de
  # seguridad para que un bucle caro se detenga solo, no una estimación del coste real.
  coste_maximo_novela: 8.0

  # Dólares por millón de tokens, por identificador de `config/models.yaml` (D-18). El coste
  # de cada llamada sale de aquí y de `usage`; el arranque falla si un rol usa un modelo sin
  # precio. Comprobados contra la tabla de precios oficial de la API el 2026-09-24; al
  # cambiar de modelo hay que volver a comprobarlos, igual que los identificadores.
  precio_usd_por_millon:
    claude-opus-5-5:
      entrada: 4.0
      salida: 20.0
    claude-sonnet-5:
      entrada: 2.0
      salida: 10.0

# ---------------------------------------------------------------------------
# Salida del modelo por rol
# ---------------------------------------------------------------------------
# El `max_tokens` de cada llamada, por rol. Vive aquí y no en config/models.yaml porque
# es una cifra del presupuesto, no un identificador (TO-013).
#
# INVARIANTE QUE SE COMPRUEBA AL ARRANCAR: `contexto.capas.margen` >= el max_tokens de
# CADA rol. Con thinking adaptativo los tokens de razonamiento cuentan dentro de
# max_tokens, así que el margen solo cubre la respuesta si esa desigualdad se cumple. Si
# no se cumple, el arranque falla en voz alta: un margen corto no da un error claro, da
# respuestas truncadas a mitad de capítulo que parecen un problema de calidad.
#
# Todos son [provisional — calibrar tras la demo] y NINGUNO supera `margen` = 6000. El
# criterio común: un capítulo de 1.500 palabras en español ronda los 2.100 tokens, así que
# lo que sobra hasta el tope es espacio de razonamiento.

modelo:
  max_tokens_por_rol:
    entrevistador: 2000   # [provisional] turnos de conversación y el brief estructurado; nunca prosa larga
    planificador: 4000    # [provisional] diez briefs de capítulo con su restricción de destino, de una vez
    redactor: 6000        # [provisional] el mayor de los seis: 2.100 de capítulo más razonamiento. Igual al margen
    editor: 6000          # [provisional] reescribe el capítulo entero, así que necesita lo mismo que el redactor
    judge: 3000           # [provisional] seis puntuaciones con su justificación, sin prosa
    extractor: 3000       # [provisional] extracción estructurada contra schema; la salida son hechos, no texto

# ---------------------------------------------------------------------------
# Verificación formal
# ---------------------------------------------------------------------------
# TO-016. El gate es lo único que bloquea; el chequeo incremental por capítulo es un
# aviso temprano y no detiene nada.
#
# EL GATE DE LEAN QUEDA FUERA DE LA DEMO. No hay toolchain Lean instalada, así que el
# coste de una demostración sigue sin medir y el timeout sigue sin fijar: se fija
# midiendo, no decidiendo. Con `gate_activo: false` el sistema no lo pide, y por eso
# `lean_timeout_segundos` puede seguir en null sin bloquear nada.
#
# Consecuencia que hay que decir en voz alta: con el gate apagado, `lean_cronologia`,
# `lean_ubicacion` y `lean_edad` NO se ejecutan y NO cierran el paso, así que la demo
# publica versiones sin demostración de cronología. Volver a `true` es la primera tarea
# después de instalar la toolchain.

formal:
  gate_activo: false             # [provisional — calibrar tras la demo] sin toolchain Lean instalada
  lean_incremental: true         # [decisión] TO-016 · aviso por capítulo, no bloqueante
  lean_timeout_segundos: null    # [bloqueado] TO-016 · falta medirlo; irrelevante mientras gate_activo sea false

# ---------------------------------------------------------------------------
# Export a PDF
# ---------------------------------------------------------------------------
# TO-025. El PDF se genera bajo demanda, una vez por versión, y en ese momento corre
# `paridad_pdf_web`. Recuento de capítulos, títulos, índice y dedicatoria son booleanos;
# lo único que necesita margen es el recuento de palabras, que difiere entre el render
# web y el paginado del PDF por guionado y saltos.

export:
  # [provisional — calibrar tras la demo] 2 % por capítulo. Sobre 1.000 palabras son
  # veinte: suficiente para absorber guionado y saltos de página, poco para que se cuele
  # un párrafo perdido en el export.
  tolerancia_recuento_palabras: 0.02

# ---------------------------------------------------------------------------
# Comprobación del modelo del harness
# ---------------------------------------------------------------------------
# Tamaño del modelo pequeño sobre el que corre el comprobador. Sale del alcance §5d,
# «por ejemplo, 5 capítulos y 2 reintentos». No es el tamaño de la novela real: es el
# espacio de estados que se explora de forma exhaustiva, y subirlo lo hace explotar.
# Corre en desarrollo, no en cada generación.

modelo_formal:
  capitulos: 5      # [alcance] §5d
  reintentos: 2     # [alcance] §5d

# ---------------------------------------------------------------------------
# Recuperación
# ---------------------------------------------------------------------------
# C-1. LA BÚSQUEDA VECTORIAL NO SE USA EN v1 (TO-015): la novela entera cabe en el
# presupuesto de la capa Recuperado, así que la recuperación es un filtro relacional por
# las entidades del brief de capítulo y nada más. El bloque `embeddings` se conserva
# porque el día que vuelva el índice vectorial estas son las claves que hay que fijar, y
# borrarlo obligaría a redescubrirlas; **en v1 no lo lee nadie**.

recuperacion:
  # [provisional — calibrar tras la demo] Tope de fragmentos que la capa Recuperado
  # ensambla tras filtrar por entidades. Doce cubre con holgura las entidades de un
  # capítulo sin acercarse al presupuesto de la capa, que es el que manda de verdad.
  max_fragmentos: 12

embeddings:
  # INACTIVO EN v1 (C-1, TO-015). No se lee; se conserva como plantilla.
  modelo: bge-m3          # alternativa aprobada: multilingual-e5-large
  version: null           # [inactivo en v1] versión concreta del modelo
  dimension: null         # [inactivo en v1] debe coincidir con la declarada en la tabla vec0
