[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "novela-agent"
version = "0.1.0"
description = "Harness multiagente que genera novelas de ciencia ficcion coherentes y no repetitivas."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "novela-agent maintainers" }]

dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "pyyaml>=6,<7",
    "jinja2>=3.1,<4",
    "anthropic>=0.34",
    "httpx>=0.27",
    "scikit-learn>=1.5,<2",
    "rapidfuzz>=3,<4",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
novela = "novela.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
novela = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sklearn.*", "rapidfuzz.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]
