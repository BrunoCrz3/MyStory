[project]
name = "storymaker-backend"
version = "1.1.0"
description = "Backend de storyMaker: genera novelas personalizadas de regalo."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0.3",
    "anthropic>=1.8.0",
    "langfuse>=4.15.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6",
    "types-PyYAML>=6",
    "types-jsonschema>=4.26.0.20260518",
    "hypothesis>=6.168.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not real' -p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "real: llama al modelo real; cuesta dinero y necesita la credencial en el entorno",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true
