[project]
name = "mystory-backend"
version = "0.1.0"
description = "Backend de MyStory: canon, contexto y ciclo de produccion de una novela"
requires-python = ">=3.12"

# El stack esta cerrado en AGENTS.md. Cada dependencia dice por que esta aqui.
dependencies = [
    "fastapi>=0.115",        # requisito tecnico cerrado
    "uvicorn[standard]>=0.32", # servidor ASGI del comando de AGENTS.md
    "pydantic>=2.9",         # contrato de datos, v2, RI-02
    "pyyaml>=6.0",           # unica forma de leer config/thresholds.yaml (RNF-14)
    "anthropic>=0.40",       # proveedor del modelo (architecture.md, Adaptacion del modelo)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",   # cliente de pruebas de FastAPI
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # Deprecacion de terceros: starlette.testclient toca un alias viejo de anyio.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
