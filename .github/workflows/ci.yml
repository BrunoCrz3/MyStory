name: CI

# Las nueve restricciones de diseno no tienen hito: se respetan en todos y CI las
# vigila en cada commit. Las reglas propias (A-02, A-12, A-35, A-37, A-40, RD-07)
# viven en `backend/tests/reglas/` y corren con el resto de la suite.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Formato y lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Comprobador de tipos
        run: uv run mypy

      - name: Pruebas
        run: uv run pytest
