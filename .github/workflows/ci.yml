name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Inventory
        run: python scripts/check_inventory.py

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck
        run: mypy src/

      - name: Tests
        run: pytest -q --cov=src/novela --cov-report=term-missing --cov-fail-under=80

      - name: Demo pipeline (offline, provider fake)
        run: python -m novela demo

      - name: Assert demo output
        run: python scripts/assert_demo_output.py

      - uses: actions/upload-artifact@v4
        with:
          name: manuscrito-demo
          path: out/demo/manuscrito.md
